rename_device:
  name: Rename device
  description: >-
    Renames a device (moves all of its learned commands under the new
    name). Carries over any device-type/icon choice made for it in the
    panel.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: remote
    old_device:
      required: true
      example: "Living Room TV"
      selector:
        text:
    new_device:
      required: true
      example: "Living Room Television"
      selector:
        text:

