list_codes:
  name: List codes
  description: >-
    Returns every Broadlink remote entity and its learned IR/RF codes,
    grouped by device. Used internally by the sidebar panel.

rename_command:
  name: Rename command
  description: >-
    Renames a learned command in place (no re-learning / no button press
    needed). Reads and writes the live entity's Store directly, so there
    is no race with Home Assistant's own periodic storage flush.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: remote
    device:
      required: true
      example: "Living Room TV"
      selector:
        text:
    old_command:
      required: true
      example: "power"
      selector:
        text:
    new_command:
      required: true
      example: "power_toggle"
      selector:
        text:

copy_command:
  name: Copy command
  description: >-
    Copies a learned command onto another device, optionally on a
    different Broadlink remote entity - codes aren't tied to a specific
    remote's MAC address, so this is a plain data copy, not a re-learn.
  fields:
    entity_id:
      required: true
      example: "remote.living_room_broadlink"
      selector:
        entity:
          domain: remote
    device:
      required: true
      example: "Living Room TV"
      selector:
        text:
    command:
      required: true
      example: "power"
      selector:
        text:
    target_entity_id:
      required: false
      description: "Defaults to the same remote entity as entity_id."
      selector:
        entity:
          domain: remote
    target_device:
      required: true
      example: "Bedroom TV"
      selector:
        text:
    target_command:
      required: false
      description: "Defaults to the same name as command."
      selector:
        text:
    overwrite:
      required: false
      default: false
      description: "Replace the target command if it already exists."
      selector:
        boolean:

learn_command:
  name: Learn command
  description: >-
    Learns one command on a Broadlink remote and reports success/failure
    back to the caller (wraps the built-in remote.learn_command, which is
    normally fire-and-forget). Use a new device name to create a new
    device entry.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: remote
    device:
      required: true
      example: "Living Room AC"
      selector:
        text:
    command:
      required: true
      example: "power"
      selector:
        text:
    alternative:
      required: false
      default: false
      selector:
        boolean:
    timeout:
      required: false
      default: 20
      selector:
        number:
          min: 5
          max: 60
          unit_of_measurement: seconds

create_device:
  name: Create device
  description: >-
    Creates a new, empty device entry. Fails if a device with that name
    already exists on the remote - learn a command for the existing
    device instead of creating a duplicate.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: remote
    device:
      required: true
      example: "Living Room TV"
